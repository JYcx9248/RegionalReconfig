# 2 -> 4 at 80K reads/s per node. Rate ~0.6 x C2; RateSteps 60:R1 with R1 ~1.2 x C2 and <= 0.75 x
# C4 = 788 (C4 = 1050 measured; C2 from calibrate-2-80k)

base: base/wiki-c1024.yaml
cluster:
  nodes: 4
  initial_nodes: 2
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 100000
load:
  nprobe: 64
  n: 200
  rate: SET_ME
  rate_steps: 60:SET_ME
  retry_for_seconds: 30
  duration_seconds: 360
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 4
