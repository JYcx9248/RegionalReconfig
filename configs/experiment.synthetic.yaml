base: base/local.yaml
paths:
  work_dir: /tmp/rtier-run
dataset:
  vectors: data/syn-base.u8bin
  queries: data/syn-query.u8bin
  ground_truth: data/syn-gt100.ibin
partition:
  file: data/assign.bin
cluster:
  nodes: 3
  initial_nodes: 2
  transfer_rate_bytes_per_sec: 200000000
  metrics_interval: 1s
  node_args: [--workers, 4, --max-nprobe, 256, --max-rerank, 1000]
  emulation:
    netns: false
    delay: 100us
    rate: 10gbit
load:
  arrivals: poisson
  rate: 200
  duration_seconds: 60
reconfigurations:
- at: 20
  data_nodes: 3
- at: 40
  data_nodes: 2
