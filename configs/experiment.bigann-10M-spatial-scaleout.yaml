base: base/bigann.yaml
paths:
  work_dir: /root/rtier-work/bigann10m-spatial
dataset:
  vectors: data/bigann-10M.u8bin
  ground_truth: data/bigann-10M-gt.ibin
build:
  index_dir: /root/rtier-work/bigann10m/index
partition:
  file: data/bigann-10M-spatial-assign.bin
cluster:
  nodes: 3
  placement: even-reversible
  transfer_rate_bytes_per_sec: 20000000
  metrics_interval: 500ms
  ready_timeout_seconds: 3600
  resources:
    cpus_per_node: 4
    io_read_iops_max: 40000
load:
  nprobe: 32
  users: 8
  user_steps: '60:24'
  retry_for_seconds: 30
  duration_seconds: 600
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 3
