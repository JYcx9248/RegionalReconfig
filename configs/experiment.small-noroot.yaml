base: base/local.yaml
paths:
  work_dir: /tmp/rtier-small-noroot
dataset:
  vectors: data/small-base.u8bin
  queries: data/small-query.u8bin
  ground_truth: data/small-gt100.ibin
partition:
  file: data/small-assign.bin
cluster:
  nodes: 2
  initial_nodes: 1
  transfer_rate_bytes_per_sec: 4000000
  metrics_interval: 500ms
  node_args: [--workers, 2, --max-nprobe, 128, --max-rerank, 1000]
  resources:
    cpus_per_node: 4
    memory_max: 4G
    read_iops_per_node: 40000
load:
  arrivals: poisson
  rate: 100
  rate_steps: 20:400
  duration_seconds: 60
reconfigurations:
- at: 25
  data_nodes: 2
