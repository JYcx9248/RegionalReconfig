# Base of the bigann experiments (8 files): the settings every one of them shared when
# they were converted from JSON. An experiment file overrides any of them.
paths:
  engine_bin: engine/build
  go_bin: bin
dataset:
  queries: data/bigann-query.u8bin
build:
  pq_m: 32
partition:
  generator: file
cluster:
  initial_nodes: 2
  protocol: lazy
  strategy: two-phase
  backend: cpu
  node_args: [--workers, 4, --max-nprobe, 256, --max-rerank, 1000]
load:
  k: 10
  n: 200
