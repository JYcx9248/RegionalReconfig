# Base of the local experiments (5 files): the settings every one of them shared when
# they were converted from JSON. An experiment file overrides any of them.
paths:
  engine_bin: engine/build
  go_bin: bin
partition:
  generator: file
cluster:
  protocol: lazy
  placement: even
  strategy: two-phase
  backend: cpu
load:
  k: 10
  nprobe: 64
  n: 200
