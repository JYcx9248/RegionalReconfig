# Base of the wiki-c1024 experiments (31 files): the settings every one of them shared when
# they were converted from JSON. An experiment file overrides any of them.
paths:
  work_dir: /netsys/chenxu/work/wiki-c1024
  engine_bin: engine/build
  go_bin: bin
dataset:
  vectors: /netsys/chenxu/data/wiki-c1024.fbin
  queries: /netsys/chenxu/data/wiki-queries.fbin
  ground_truth: /netsys/chenxu/data/wiki-c1024-gt.ibin
build:
  index_dir: /netsys/chenxu/work/wiki-c1024/index
  pq_m: 64
  threads: 64
partition:
  generator: file
  file: /netsys/chenxu/data/wiki-c1024-assign.bin
cluster:
  placement: even-reversible-blocks
  strategy: two-phase
  metrics_interval: 500ms
  ready_timeout_seconds: 3600
  node_args: [--workers, 8, --max-nprobe, 256, --max-rerank, 1000]
  resources:
    memory_max: 24G
load:
  k: 10
  arrivals: poisson
