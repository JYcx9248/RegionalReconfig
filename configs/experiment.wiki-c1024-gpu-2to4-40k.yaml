# 2 -> 4 at 40K reads/s per node on GPUs 3-6 (the 40 GB PCIe cards as numbered on 2026-10-08), the
# rates of results/wiki-gpu/2to4 (C2 ~330, C4 ~520): for lazy-stream, and a lazy rerun to compare
# with that run

base: base/wiki-c1024.yaml
cluster:
  nodes: 4
  initial_nodes: 2
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 40000
load:
  nprobe: 64
  n: 200
  rate: 210
  rate_steps: 60:420
  retry_for_seconds: 30
  duration_seconds: 360
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 4
