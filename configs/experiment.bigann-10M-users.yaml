base: base/bigann.yaml
paths:
  work_dir: /root/rtier-work/bigann10m
dataset:
  vectors: data/bigann-10M.u8bin
  ground_truth: data/bigann-10M-gt.ibin
partition:
  file: data/bigann-10M-assign.bin
cluster:
  nodes: 3
  placement: even-reversible
  transfer_rate_bytes_per_sec: 20000000
  metrics_interval: 500ms
  ready_timeout_seconds: 3600
  resources:
    cpus_per_node: 4
    io_read_iops_max: 40000
load:
  nprobe: 32
  users: 8
  user_steps: 60:24,330:8
  retry_for_seconds: 30
  duration_seconds: 420
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 3
- at: 360
  data_nodes: 2
