base: base/bigann.yaml
paths:
  work_dir: /tmp/rtier-run
dataset:
  vectors: data/bigann-10M.u8bin
  ground_truth: data/bigann-10M-gt100.ibin
partition:
  file: data/assign.bin
cluster:
  nodes: 3
  placement: even
  transfer_rate_bytes_per_sec: 200000000
  metrics_interval: 1s
  emulation:
    netns: false
    delay: 100us
    rate: 10gbit
load:
  nprobe: 64
  arrivals: poisson
  rate: 200
  duration_seconds: 60
reconfigurations:
- at: 20
  data_nodes: 3
- at: 40
  data_nodes: 2
