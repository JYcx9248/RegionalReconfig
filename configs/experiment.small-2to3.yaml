base: base/local.yaml
paths:
  work_dir: /tmp/rtier-small
dataset:
  vectors: data/small-base.u8bin
  queries: data/small-query.u8bin
  ground_truth: data/small-gt100.ibin
partition:
  file: data/small-assign.bin
cluster:
  nodes: 3
  initial_nodes: 2
  transfer_rate_bytes_per_sec: 4000000
  metrics_interval: 500ms
  node_args: [--workers, 2, --max-nprobe, 128, --max-rerank, 1000, --pq-capacity, 190000]
load:
  arrivals: poisson
  rate: 200
  rate_steps: 20:600
  duration_seconds: 90
reconfigurations:
- at: 25
  data_nodes: 3
- at: 60
  data_nodes: 2
