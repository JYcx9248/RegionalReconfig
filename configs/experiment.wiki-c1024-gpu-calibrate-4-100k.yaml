# 4-node capacity at 80K reads/s per node, for experiment.wiki-c1024-gpu-2to4-80k.json

base: base/wiki-c1024.yaml
cluster:
  nodes: 4
  initial_nodes: 4
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 80000
load:
  nprobe: 64
  n: 200
calibrate:
  rates: [1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000]
  seconds_per_rate: 30
