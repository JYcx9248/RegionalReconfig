# 2 -> 4 at 90 s, back to 2 at 300 s (load 250/s < C2 from 280 s). For lazy: copy-then-flip's
# scale-out does not finish by 300 s, so its scale-in would start late

base: base/wiki-c1024.yaml
cluster:
  nodes: 4
  initial_nodes: 2
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 40000
load:
  nprobe: 64
  n: 200
  rate: 210
  rate_steps: 60:420,280:210
  retry_for_seconds: 30
  duration_seconds: 480
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 4
- at: 300
  data_nodes: 2
