# 2 -> 4 at 90 s while the load (265/s = 0.8 x C2) is still below the 2-node capacity: the old
# owners have spare reads for copy-then-flip's copy

base: base/wiki-c1024.yaml
cluster:
  nodes: 4
  initial_nodes: 2
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 40000
load:
  nprobe: 64
  n: 200
  rate: 210
  rate_steps: 60:265
  retry_for_seconds: 30
  duration_seconds: 360
  warmup_seconds: 30
reconfigurations:
- at: 90
  data_nodes: 4
