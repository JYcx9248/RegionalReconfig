base: base/bigann.yaml
paths:
  work_dir: /tmp/rtier-bigann1m
dataset:
  vectors: data/bigann-1M.u8bin
  ground_truth: data/bigann-1M-gt100.ibin
partition:
  file: data/bigann-1M-assign.bin
cluster:
  nodes: 3
  placement: even-reversible
  transfer_rate_bytes_per_sec: 20000000
  metrics_interval: 500ms
load:
  nprobe: 64
  users: 8
  user_steps: 30:24,110:8
  retry_for_seconds: 30
  duration_seconds: 150
  warmup_seconds: 15
reconfigurations:
- at: 40
  data_nodes: 3
- at: 120
  data_nodes: 2
