# 2-node capacity at 60K reads/s per node, for experiment.wiki-c1024-gpu-2to4-60k.json

base: base/wiki-c1024.yaml
cluster:
  nodes: 2
  initial_nodes: 2
  protocol: lazy
  transfer_rate_bytes_per_sec: 0
  backend: gpu
  gpus: [3, 4, 5, 6]
  resources:
    cpus_per_node: 8
    read_iops_per_node: 60000
load:
  nprobe: 64
  n: 200
calibrate:
  rates: [150, 300, 400, 450, 500, 550, 600, 700]
  seconds_per_rate: 30
